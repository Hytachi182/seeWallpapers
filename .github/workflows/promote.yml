name: 1 - Prepare version
run-name: Prepare devops version (${{ inputs.bump || 'auto' }})

on:
  push:
    branches: [devops]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto detects new wallpapers and conventional feature commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Preview metadata without pushing commits or publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devops-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata on devops
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUMP: ${{ inputs.bump || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          EXPECTED_SOURCE: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--repository "$REPOSITORY" --bump "$BUMP")
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          if [ -n "$EXPECTED_SOURCE" ]; then args+=(--expected-source "$EXPECTED_SOURCE"); fi
          python build/promote_release.py "${args[@]}"
      - name: Upload prepared metadata for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-release-metadata
          path: |
            .github/release-plan.json
            docs/releases/*.md
            docs/template-catalogue.md
          if-no-files-found: ignore
          include-hidden-files: true
