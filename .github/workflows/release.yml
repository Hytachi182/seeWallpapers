name: 3 - Publish Windows release
run-name: Windows release - ${{ inputs.release_version || github.ref_name }}

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string
      publish_release:
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publication-plan:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'devops'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.required }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the reviewed release plan
        id: plan
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'build')
          from promote_release import verify
          plan = verify(Path.cwd(), os.environ['PR_HEAD'])
          assert re.fullmatch(r'\d+\.\d+\.\d+', plan['version'])
          assert plan['tag'] == 'v' + plan['version']
          assert isinstance(plan['release_required'], bool)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(plan['release_required']).lower() + '\n')
              output.write('version=' + plan['version'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## ' + plan['title'] + '\n\n')
              summary.write('Windows packaging and publication will follow.\n' if plan['release_required'] else 'Documentation only: no new release or Windows packaging.\n')
          PY


  package:
    needs: publication-plan
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (needs.publication-plan.result == 'success' && needs.publication-plan.outputs.required == 'true'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check version and run tests
        id: version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.release_version || needs.publication-plan.outputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          [xml]$project = Get-Content src/SeeWallpaper.App/SeeWallpaper.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version must match.' }
          if ($env:EXPECTED_VERSION -and $env:EXPECTED_VERSION -ne $version) { throw 'Reviewed release plan and application version must match.' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable X.Y.Z application version is required.' }
          if ($env:PUBLISH_RELEASE -eq 'true' -and !(Test-Path "docs/releases/v$version.md")) { throw 'Release notes are missing.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          python -m unittest discover -s build/tests -p 'test_release_automation.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release automation tests failed.' }
          dotnet restore seeWallpaper.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build seeWallpaper.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test seeWallpaper.sln --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          ./build/test-application-update.ps1
      - name: Install the signed Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B.V.') { throw 'Invalid compiler signature.' }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/CURRENTUSER' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
      - name: Build and verify Windows packages
        shell: pwsh
        run: |
          ./build/build-installer.ps1
          ./build/test-installer.ps1
          ./build/build-portable.ps1
          ./build/test-portable.ps1
          ./build/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: seeWallpaper-Windows-${{ steps.version.outputs.version }}-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      always() && needs.package.result == 'success' &&
      (inputs.publish_release == true || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: seeWallpaper-Windows-${{ needs.package.outputs.version }}-x64
          path: release-assets
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python build/publish_release.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --assets release-assets
      - name: Publication summary
        if: always()
        run: |
          echo "## Windows release: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ needs.package.outputs.version }}. [Downloads](https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ needs.package.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
