name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore seeWallpaper.sln
      - run: dotnet build seeWallpaper.sln --configuration Release --no-restore
      - run: dotnet test seeWallpaper.sln --configuration Release --no-build
