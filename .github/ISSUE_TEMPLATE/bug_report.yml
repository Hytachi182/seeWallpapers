name: Report a bug
description: An installation, display, or wallpaper issue.
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected result, actual behavior, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: seeWallpaper version
      placeholder: '1.3.0 - installer or ZIP'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and display configuration
      description: Windows version, graphics card, number of displays, resolutions, and scaling.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error message
      description: Add a screenshot or relevant log lines. Remove personal information before sharing.
