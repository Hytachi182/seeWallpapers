name: Signaler un problème
description: Un problème d'installation, d'affichage ou de screener.
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le résultat attendu, ce qui se passe et les étapes pour reproduire.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de seeWallpaper
      placeholder: '1.2.0 - installeur ou ZIP'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Configuration Windows et écrans
      description: Version Windows, carte graphique, nombre d'écrans, résolutions et mise à l'échelle.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capture ou message d'erreur
      description: Ajoutez une capture ou les lignes utiles du journal. Retirez les informations personnelles avant de partager.
