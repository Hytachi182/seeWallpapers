<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlit Dunes</title>
<style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b}canvas{display:block;width:100%;height:100%}[hidden]{display:none!important}#fallback{position:fixed;inset:0;display:grid;place-content:center;background:#07101d;color:#dbe9f7;font:16px 'Segoe UI',sans-serif;padding:32px}#fallback img{width:min(80vw,960px);max-height:70vh;object-fit:contain}::selection{background:#cda978;color:#03060b}</style></head>
<body><canvas aria-label="Moonlit Dunes animated wallpaper"></canvas><div id="fallback" hidden><img src="preview.jpg" alt="Moonlit Dunes static preview"><p>WebGL is unavailable. Enable graphics acceleration to animate this wallpaper.</p></div>
<script type="application/json" id="defaults">{"color":"#cda978","speed":1,"intensity":1}</script><script id="fragment" type="x-shader/x-fragment">precision highp float;
uniform vec2 resolution;uniform float time;uniform vec3 accent;uniform float intensity;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+vec2(7.2,4.1);a*=.5;}return v;}
vec3 finish(vec3 c,vec2 uv){c*=1.-.2*smoothstep(.3,.9,length(uv-.5));return pow(max(c,0.),vec3(.93));}

void main(){
 vec2 uv=gl_FragCoord.xy/resolution,p=(gl_FragCoord.xy-.5*resolution)/resolution.y;
 vec3 col=mix(vec3(.075,.065,.14),vec3(.008,.016,.04),uv.y);
 vec2 stars=p*300.;float star=pow(max(0.,1.-length(fract(stars)-.5)*2.),20.)*step(.993,hash(floor(stars)));
 col+=vec3(.65,.73,.95)*star*smoothstep(.48,.8,uv.y);
 vec2 moon=p-vec2(.3,.22);float disk=1.-smoothstep(.061,.063,length(moon));
 float shadow=1.-smoothstep(.06,.063,length(moon-vec2(.026,.009)));
 col+=vec3(.86,.86,1.)*max(disk-shadow,0.)*intensity;
 col+=accent*.04*exp(-length(moon)*5.);
 for(int i=0;i<7;i++){
  float f=float(i),ridge=.45-f*.075+.055*sin(p.x*(2.+f*.14)+f*1.7)+.015*sin(p.x*7.+f);
  float slope=clamp((ridge-uv.y)*8.,0.,1.);
  vec3 sand=mix(accent*.11,accent*(.37+.075*f),pow(1.-slope,2.));
  float grains=noise(vec2(p.x*260.,uv.y*240.));
  float ripples=sin(p.x*105.+uv.y*88.+noise(p*10.)*7.-time*.85);
  sand*=.90+.10*grains+.04*ripples;
  sand+=accent*exp(-abs(uv.y-ridge)*220.)*.14;
  col=mix(col,sand,1.-smoothstep(ridge-.001,ridge+.001,uv.y));
 }
 float dust=pow(fbm(p*7.+vec2(time*.19,-time*.036)),4.);
 col+=accent*dust*.24*intensity;
 float windMask=1.-smoothstep(.37,.45,uv.y);
 float streams=pow(max(0.,sin(p.x*18.+uv.y*58.-time*1.7+noise(vec2(p.x*5.-time*.22,uv.y*9.))*3.)),7.);
 col+=accent*streams*.085*windMask*intensity;
 gl_FragColor=vec4(finish(col,uv),1.);
}</script><script src="scene.js"></script></body></html>
