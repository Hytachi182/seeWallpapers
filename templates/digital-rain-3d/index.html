<!doctype html><html><head><meta charset="utf-8"><title>Digital Rain 3D</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#020806}canvas{filter:drop-shadow(0 0 6px #00ff66)}</style></head><body><canvas></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let speed=1,color='#00ff66',paused=false,fps=60;const schedule=()=>setTimeout(()=>requestAnimationFrame(draw),1000/fps);function draw(t){if(!paused){c.width=innerWidth;c.height=innerHeight;x.fillStyle='rgba(2,8,6,.11)';x.fillRect(0,0,c.width,c.height);x.fillStyle=color;x.font='15px monospace';for(let i=0;i<150;i++){let z=(i*71+t*.05*speed)%c.height;x.globalAlpha=.25+(i%5)/6;x.fillText(String.fromCharCode(0x30A0+(i*13)%96),i*23%c.width,z)}}schedule()}schedule();window.seeWallpaper?.onSettingsChanged(s=>{speed=s.speed??speed;color=s.color??color});window.seeWallpaper?.onPause(()=>paused=true);window.seeWallpaper?.onResume(()=>paused=false);window.seeWallpaper?.onPerformanceChanged(value=>fps=value)</script></body></html>
