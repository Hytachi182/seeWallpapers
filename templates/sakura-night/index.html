<!doctype html><html><head><meta charset="utf-8"><title>Sakura Night</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 70% 22%,#7f6ca1 0 6%,#221534 28%,#090c20 75%)}</style></head><body><canvas></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let density=1,paused=false,fps=60;const schedule=()=>setTimeout(()=>requestAnimationFrame(f),1000/fps);function f(t){if(!paused){c.width=innerWidth;c.height=innerHeight;x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(245,178,218,.85)';for(let i=0;i<100*density;i++){let a=i*1.77+t/1700,y=(i*83+t/13)%c.height;x.save();x.translate((i*137+t/30)%c.width,y);x.rotate(a);x.beginPath();x.ellipse(0,0,5,2,0,0,7);x.fill();x.restore()}}schedule()}schedule();window.seeWallpaper?.onSettingsChanged(s=>density=s.petalDensity??density);window.seeWallpaper?.onPause(()=>paused=true);window.seeWallpaper?.onResume(()=>paused=false);window.seeWallpaper?.onPerformanceChanged(value=>fps=value)</script></body></html>
