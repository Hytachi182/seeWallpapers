<!doctype html><html><head><meta charset="utf-8"><title>AI Core</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#061325}</style></head><body><canvas></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let color='#7468ff',intensity=1,paused=false,fps=60;const schedule=()=>setTimeout(()=>requestAnimationFrame(f),1000/fps);function f(t){if(!paused){c.width=innerWidth;c.height=innerHeight;let cx=c.width/2,cy=c.height/2,r=110+Math.sin(t/650)*18*intensity;x.clearRect(0,0,c.width,c.height);for(let i=0;i<48;i++){let a=i/48*7+t/1800,ox=cx+Math.cos(a)*r*2,oy=cy+Math.sin(a)*r*1.2;x.strokeStyle=color+'66';x.beginPath();x.moveTo(cx,cy);x.lineTo(ox,oy);x.stroke();x.fillStyle=color;x.beginPath();x.arc(ox,oy,3,0,7);x.fill()}let g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'#ffffff');g.addColorStop(.2,color);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}}schedule()}schedule();window.seeWallpaper?.onSettingsChanged(s=>{color=s.color??color;intensity=s.intensity??intensity});window.seeWallpaper?.onPause(()=>paused=true);window.seeWallpaper?.onResume(()=>paused=false);window.seeWallpaper?.onPerformanceChanged(value=>fps=value)</script></body></html>
