<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firefly Grove</title>
<style>:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b}canvas{display:block;width:100%;height:100%}[hidden]{display:none!important}#fallback{position:fixed;inset:0;display:grid;place-content:center;background:#07101d;color:#dbe9f7;font:16px 'Segoe UI',sans-serif;padding:32px}#fallback img{width:min(80vw,960px);max-height:70vh;object-fit:contain}::selection{background:#b3ef78;color:#03060b}</style></head>
<body><canvas aria-label="Firefly Grove animated wallpaper"></canvas><div id="fallback" hidden><img src="preview.jpg" alt="Firefly Grove static preview"><p>WebGL is unavailable. Enable graphics acceleration to animate this wallpaper.</p></div>
<script type="application/json" id="defaults">{"color":"#b3ef78","speed":1,"intensity":1}</script><script id="fragment" type="x-shader/x-fragment">precision highp float;
uniform vec2 resolution;uniform float time;uniform vec3 accent;uniform float intensity;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+vec2(7.2,4.1);a*=.5;}return v;}
vec3 finish(vec3 c,vec2 uv){c*=1.-.2*smoothstep(.3,.9,length(uv-.5));return pow(max(c,0.),vec3(.93));}

void main(){
 vec2 uv=gl_FragCoord.xy/resolution,p=(gl_FragCoord.xy-.5*resolution)/resolution.y;
 vec3 col=vec3(.008,.024,.027)+vec3(.035,.085,.076)*exp(-length(p-vec2(.13,.15))*3.);
 // Light shafts slowly sweep and breathe as the canopy shifts.
 float shafts=pow(.5+.5*sin(p.x*9.+p.y*3.+sin(time*.13)*1.1),7.)*smoothstep(-.4,.35,p.y)*(.6+.4*sin(time*.37+p.x*2.3));
 col+=vec3(.08,.15,.12)*shafts;
 for(int i=0;i<12;i++){
  float f=float(i),x=(hash(vec2(f,1.))-.5)*2.8,layer=hash(vec2(f,2.));
  float trunk=abs(p.x-x-.015*sin(p.y*3.+f));
  float silhouette=1.-smoothstep(.018+.025*layer,.024+.025*layer,trunk);
  float canopy=1.-smoothstep(.06,.20,abs(p.x-x)*.6+abs(p.y-.3-layer*.1)*.3);
  col=mix(col,vec3(.006,.016,.017)+vec3(.013,.033,.027)*layer,max(silhouette,canopy*.8)*(.5+.4*layer));
 }
 float mist=fbm(p*3.+vec2(time*.06,time*.012)),haze=fbm(p*6.5-vec2(time*.11,0.));
 col+=vec3(.05,.10,.08)*mist*exp(-abs(p.y+.15)*5.)+vec3(.03,.06,.05)*haze*exp(-abs(p.y+.28)*9.);
 for(int i=0;i<44;i++){
  float f=float(i),phase=hash(vec2(f,4.))*6.283,pace=.7+.6*hash(vec2(f,5.));
  vec2 pos=vec2((hash(vec2(f,1.))-.5)*2.4,(hash(vec2(f,2.))-.5)*.8);
  // Lazy looping flight paths with small darting corrections.
  pos+=vec2(sin(time*.33*pace+phase)*.13+sin(time*1.1*pace+phase*3.)*.025,cos(time*.26*pace+phase*2.)*.08+sin(time*.9*pace+phase)*.02);
  float r=length(p-pos),pulse=.12+.88*pow(.5+.5*sin(time*1.5*pace+phase),3.);
  col+=accent*(exp(-r*38.)*.06+exp(-r*125.)*.5+exp(-r*420.)*2.2)*pulse*intensity;
 }
 float floorLine=-.35+.035*sin(p.x*3.);
 col=mix(col,vec3(.004,.013,.011),1.-smoothstep(floorLine-.005,floorLine+.005,p.y));
 // Foreground grass: tapered blades bending with slow gusts.
 float above=p.y-floorLine,gust=sin(time*.7+p.x*2.5)*.6+sin(time*1.7+p.x*7.)*.25;
 float xs=p.x-above*above*9.*gust,cell=floor(xs*75.),blade=fract(xs*75.)-.5;
 float height=.025+.06*hash(vec2(cell,3.));
 float grass=step(0.,above)*step(above,height)*step(abs(blade),.42*(1.-above/height));
 col=mix(col,vec3(.006,.02,.015),grass);
 gl_FragColor=vec4(finish(col,uv),1.);
}</script><script src="scene.js"></script></body></html>
